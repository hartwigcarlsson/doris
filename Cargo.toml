[workspace]
resolver = "3"
members = ["crates/eventstore", "crates/identity", "crates/proto", "crates/server", "crates/web", "crates/company", "crates/ledger", "crates/invoicing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
doris-eventstore = { path = "crates/eventstore" }
doris-identity = { path = "crates/identity" }
doris-proto = { path = "crates/proto" }
doris-company = { path = "crates/company" }
doris-ledger = { path = "crates/ledger" }
doris-invoicing = { path = "crates/invoicing" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form"] }
base64 = "0.23"
getrandom = "0.4"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
mime_guess = "2"
prost = "0.14"
rust-embed = "8"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-web = "0.14"
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Release builds strip debuginfo by default. On macOS 27 the stripped
# proc-macro dylibs (e.g. sqlx-macros) fail to load ("mis-aligned LINKEDIT
# string pool"), so don't strip what only runs at build time.
[profile.release.build-override]
strip = "none"

# Size-optimized profile for the browser build; `make dist` builds the wasm
# with it (debug builds for `make dev`/`make e2e` stay fast). About 40% smaller
# than plain release.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
