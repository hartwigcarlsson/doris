syntax = "proto3";

package doris.payroll.v1;

import "doris/ledger/v1/ledger.proto";

// Employees and payroll runs (lönekörningar). Every call needs a session
// and a company the caller is a member of. Amounts are öre.
service PayrollService {
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse);
  rpc AddEmployee(AddEmployeeRequest) returns (AddEmployeeResponse);
  // Name, monthly salary and salary account; never the personnummer.
  rpc UpdateEmployee(UpdateEmployeeRequest) returns (UpdateEmployeeResponse);
  rpc DeactivateEmployee(DeactivateEmployeeRequest) returns (DeactivateEmployeeResponse);
  // The employee's A-skatt setting: a table and column, or a percentage.
  rpc SetEmployeeTax(SetEmployeeTaxRequest) returns (SetEmployeeTaxResponse);

  // What a draft would lock if finalized now. Writes nothing.
  rpc PreviewPayrollRun(PreviewPayrollRunRequest) returns (PreviewPayrollRunResponse);
  rpc CreatePayrollRun(CreatePayrollRunRequest) returns (CreatePayrollRunResponse);
  // Only an open run changes.
  rpc UpdatePayrollRun(UpdatePayrollRunRequest) returns (UpdatePayrollRunResponse);
  // Locks amounts, fees and accounts; the pay date may be in the future.
  rpc FinalizePayrollRun(PayrollRunRef) returns (FinalizePayrollRunResponse);
  // A finalized run that is not booked.
  rpc ReopenPayrollRun(PayrollRunRef) returns (ReopenPayrollRunResponse);
  // Books a finalized run as a voucher, no earlier than its pay date.
  rpc BookPayrollRun(PayrollRunRef) returns (VoucherRef);
  // Backa bokföring: a rättelse of the run's voucher; returns the rättelse.
  rpc UnbookPayrollRun(PayrollRunRef) returns (VoucherRef);
  rpc GetPayrollRun(PayrollRunRef) returns (PayrollRun);
  // Newest pay date first.
  rpc ListPayrollRuns(ListPayrollRunsRequest) returns (ListPayrollRunsResponse);

  // Arbetsgivardeklaration på individnivå (AGI), per period ÅÅÅÅMM.
  rpc GetAgiContact(GetAgiContactRequest) returns (AgiContact); // empty fields when unset
  rpc SetAgiContact(SetAgiContactRequest) returns (SetAgiContactResponse);
  rpc ListAgiMonths(ListAgiMonthsRequest) returns (ListAgiMonthsResponse);
  rpc GetAgiMonth(AgiMonthRef) returns (AgiMonth);
  // The file for Skatteverket's e-tjänst; contains personnummer.
  rpc ExportAgiFile(AgiMonthRef) returns (AgiFile);
  // After the file is uploaded: records what was submitted.
  rpc MarkAgiSubmitted(MarkAgiSubmittedRequest) returns (MarkAgiSubmittedResponse);
}

message Employee {
  string id = 1;
  string name = 2;
  string personal_identity_number = 3; // ÅÅÅÅMMDD-NNNN
  int64 monthly_salary = 4;
  uint32 salary_account = 5;
  bool active = 6;
  TaxSetting tax = 7; // unset: no setting, tax is typed
}

message ListEmployeesRequest {
  string company_id = 1;
}
message ListEmployeesResponse {
  repeated Employee employees = 1;
}

message AddEmployeeRequest {
  string company_id = 1;
  string name = 2;
  string personal_identity_number = 3;
  int64 monthly_salary = 4;
  uint32 salary_account = 5;
  TaxSetting tax = 6; // optional
}
message AddEmployeeResponse {
  string employee_id = 1;
}

message UpdateEmployeeRequest {
  string company_id = 1;
  string employee_id = 2;
  string name = 3;
  int64 monthly_salary = 4;
  uint32 salary_account = 5;
}
message UpdateEmployeeResponse {}

message DeactivateEmployeeRequest {
  string company_id = 1;
  string employee_id = 2;
}
message DeactivateEmployeeResponse {}

message PayrollRunLineInput {
  string employee_id = 1;
  int64 gross = 2;
  optional int64 tax = 3; // unset: computed
}
message PayrollRunDraft {
  string pay_date = 1; // YYYY-MM-DD
  string text = 2;     // empty: "Lön {månad} {år}"
  repeated PayrollRunLineInput lines = 3;
}
message PayrollRunRef {
  string company_id = 1;
  string payroll_run_id = 2;
}
message VoucherRef {
  string fiscal_year_start = 1;
  uint32 number = 2;
}

message PreviewPayrollRunRequest {
  string company_id = 1;
  PayrollRunDraft draft = 2;
}
message PreviewPayrollRunResponse {
  string text = 1;
  repeated PayrollRunLine lines = 2;
  repeated doris.ledger.v1.VoucherLine voucher_lines = 3;
}

message CreatePayrollRunRequest {
  string company_id = 1;
  PayrollRunDraft draft = 2;
}
message CreatePayrollRunResponse {
  string payroll_run_id = 1;
}

message UpdatePayrollRunRequest {
  PayrollRunRef run = 1;
  PayrollRunDraft draft = 2;
}
message UpdatePayrollRunResponse {}

message FinalizePayrollRunResponse {}
message ReopenPayrollRunResponse {}

message ListPayrollRunsRequest {
  string company_id = 1;
}
message ListPayrollRunsResponse {
  repeated PayrollRun payroll_runs = 1;
}

enum PayrollRunStatus {
  PAYROLL_RUN_STATUS_UNSPECIFIED = 0;
  PAYROLL_RUN_STATUS_OPEN = 1;
  PAYROLL_RUN_STATUS_FINALIZED = 2;
  PAYROLL_RUN_STATUS_BOOKED = 3;
}

message PayrollRunLine {
  string employee_id = 1;
  string employee_name = 2;
  int64 gross = 3;
  optional int64 tax = 4; // unset: an open line, computed when finalized
  // Set once finalized (and in a preview).
  uint32 salary_account = 5;
  uint32 fee_rate = 6; // basis points
  int64 fee = 7;
  int64 net = 8;
  TaxBasis tax_basis = 9; // once finalized, and in a preview
}

message PayrollRun {
  string id = 1;
  string pay_date = 2;
  string text = 3;
  PayrollRunStatus status = 4;
  repeated PayrollRunLine lines = 5;
  repeated doris.ledger.v1.VoucherLine voucher_lines = 6; // once finalized
  VoucherRef voucher = 7;                                  // while booked
}

message TableTax {
  uint32 table = 1;  // 29-42
  uint32 column = 2; // 1-6
}
message TaxSetting {
  oneof kind {
    TableTax table = 1;
    uint32 percent = 2; // 0-100
  }
}
message TableBasis {
  uint32 year = 1;
  uint32 table = 2;
  uint32 column = 3;
}
message TaxBasis {
  oneof kind {
    TableBasis table = 1;
    uint32 percent = 2;
    bool manual = 3;
  }
}
message SetEmployeeTaxRequest {
  string company_id = 1;
  string employee_id = 2;
  TaxSetting tax = 3;
}
message SetEmployeeTaxResponse {}

message AgiContact {
  string name = 1;
  string phone = 2;
  string email = 3;
}
message GetAgiContactRequest { string company_id = 1; }
message SetAgiContactRequest {
  string company_id = 1;
  AgiContact contact = 2;
}
message SetAgiContactResponse {}
message AgiMonthRef {
  string company_id = 1;
  string period = 2; // ÅÅÅÅMM
}
enum AgiStatus {
  AGI_STATUS_UNSPECIFIED = 0;
  AGI_STATUS_NOT_SUBMITTED = 1;
  AGI_STATUS_SUBMITTED = 2;
  AGI_STATUS_CHANGED = 3;
}
message AgiMonthSummary {
  string period = 1;
  int64 gross = 2;         // kronor
  int64 tax_sum = 3;       // FK497
  int64 fee_sum = 4;       // FK487
  AgiStatus status = 5;
  string submitted_at = 6; // the latest, empty if never
}
message ListAgiMonthsRequest { string company_id = 1; }
message ListAgiMonthsResponse { repeated AgiMonthSummary months = 1; }
enum AgiChange {
  AGI_CHANGE_UNSPECIFIED = 0;
  AGI_CHANGE_NEW = 1;
  AGI_CHANGE_CHANGED = 2;
  AGI_CHANGE_REMOVED = 3;
  AGI_CHANGE_UNCHANGED = 4;
}
message AgiLine {
  string employee_id = 1;
  string employee_name = 2;
  string personal_identity_number = 3; // ÅÅÅÅMMDD-NNNN
  uint64 specification_number = 4;
  int64 gross = 5;                     // kronor (FK011)
  int64 tax = 6;                       // kronor (FK001)
  AgiChange change = 7;
}
message AgiMonth {
  AgiMonthSummary summary = 1;
  repeated AgiLine lines = 2; // removed ones last
  int64 booked_fees = 3;      // öre on 2731, for comparison
  string fingerprint = 4;     // what MarkAgiSubmitted must be sent
}
message AgiFile {
  string file_name = 1;
  string xml = 2;
  string fingerprint = 3; // the month in the file, for MarkAgiSubmitted
}
message MarkAgiSubmittedRequest {
  string company_id = 1;
  string period = 2;      // ÅÅÅÅMM
  string fingerprint = 3; // of the file uploaded (or the month shown)
}
message MarkAgiSubmittedResponse {}
