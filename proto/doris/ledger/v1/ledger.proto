syntax = "proto3";

package doris.ledger.v1;

// A company's chart of accounts and its vouchers (verifikationer). Every RPC
// needs a session; a company the caller isn't a member of answers NOT_FOUND
// "company_not_found". Dates are YYYY-MM-DD; amounts are öre.
service LedgerService {
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc AddAccount(AddAccountRequest) returns (AddAccountResponse);
  rpc RenameAccount(RenameAccountRequest) returns (RenameAccountResponse);
  rpc SetAccountActive(SetAccountActiveRequest) returns (SetAccountActiveResponse);
  // An account's box on the momsdeklaration; 0 takes it away.
  rpc SetAccountVatBox(SetAccountVatBoxRequest) returns (SetAccountVatBoxResponse);
  // From the first räkenskapsår up to the current one, newest first.
  rpc ListFiscalYears(ListFiscalYearsRequest) returns (ListFiscalYearsResponse);
  // The server decides the voucher's number.
  rpc RecordVoucher(RecordVoucherRequest) returns (RecordVoucherResponse);
  // Books a reversing voucher in the original's fiscal year.
  rpc CorrectVoucher(CorrectVoucherRequest) returns (CorrectVoucherResponse);
  // The grundbok for one fiscal year, by number.
  rpc ListVouchers(ListVouchersRequest) returns (ListVouchersResponse);
  // Adds an underlag to a voucher, also in a closed year.
  rpc AddAttachment(AddAttachmentRequest) returns (AddAttachmentResponse);
  // One underlag of a voucher, with its bytes.
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);
  // The saldobalans for one fiscal year: debit and credit per account with
  // lines in it, by account number.
  rpc GetTrialBalance(GetTrialBalanceRequest) returns (GetTrialBalanceResponse);
  // One account's huvudbok for one fiscal year: its lines by date, then
  // voucher number, with the balance after each.
  rpc GetAccountLedger(GetAccountLedgerRequest) returns (GetAccountLedgerResponse);
  // The resultaträkning and balansräkning for one fiscal year under ÅRL
  // headings, with the year before as comparison.
  rpc GetFinancialStatements(GetFinancialStatementsRequest) returns (GetFinancialStatementsResponse);
  // The first fiscal year's ingående balanser, by account.
  rpc GetOpeningBalances(GetOpeningBalancesRequest) returns (GetOpeningBalancesResponse);
  // Replaces them. Only while the first fiscal year is open.
  rpc SetOpeningBalances(SetOpeningBalancesRequest) returns (SetOpeningBalancesResponse);
  // Books the year's result (8999 against 2099 or 2019) and locks the year.
  // Years close oldest first, once they have ended.
  rpc CloseFiscalYear(CloseFiscalYearRequest) returns (CloseFiscalYearResponse);
  // Unlocks the newest closed year and reverses its result voucher.
  rpc ReopenFiscalYear(ReopenFiscalYearRequest) returns (ReopenFiscalYearResponse);
}

message Account {
  uint32 number = 1;
  string name = 2;
  bool active = 3;
  uint32 vat_box = 4; // box on the momsdeklaration, 0: none
}

message ListAccountsRequest {
  string company_id = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message AddAccountRequest {
  string company_id = 1;
  uint32 number = 2;
  string name = 3;
}

message AddAccountResponse {}

message RenameAccountRequest {
  string company_id = 1;
  uint32 number = 2;
  string name = 3;
}

message RenameAccountResponse {}

message SetAccountActiveRequest {
  string company_id = 1;
  uint32 number = 2;
  bool active = 3;
}

message SetAccountActiveResponse {}

message SetAccountVatBoxRequest {
  string company_id = 1;
  uint32 number = 2;
  uint32 vat_box = 3; // 0: none
}

message SetAccountVatBoxResponse {}

message FiscalYear {
  string start = 1;
  string end = 2;
  bool closed = 3;
}

message ListFiscalYearsRequest {
  string company_id = 1;
}

message ListFiscalYearsResponse {
  repeated FiscalYear fiscal_years = 1;
}

// Exactly one of debit and credit is positive.
message VoucherLine {
  uint32 account = 1;
  int64 debit = 2;
  int64 credit = 3;
}

message RecordVoucherRequest {
  string company_id = 1;
  string date = 2;
  string text = 3;
  repeated VoucherLine lines = 4;
  repeated NewAttachment attachments = 5;
}

message RecordVoucherResponse {
  string fiscal_year_start = 1;
  uint32 number = 2;
}

message CorrectVoucherRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
  uint32 number = 3;
  string date = 4;
}

message CorrectVoucherResponse {
  uint32 number = 1;
}

message ListVouchersRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
}

// corrects and corrected_by are voucher numbers in the same fiscal year;
// 0 means none.
message Voucher {
  uint32 number = 1;
  string date = 2;
  string text = 3;
  repeated VoucherLine lines = 4;
  uint32 corrects = 5;
  uint32 corrected_by = 6;
  repeated Attachment attachments = 7;
  // When the voucher was recorded (RFC 3339, UTC) and by whom (the user's
  // display name; empty if unknown). Set by ListVouchers; empty elsewhere.
  string recorded_at = 8;
  string recorded_by_name = 9;
}

message ListVouchersResponse {
  repeated Voucher vouchers = 1;
}

message GetTrialBalanceRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
}

// The balance is debit - credit; positive is a debit balance. opening is the
// ingående balans; the utgående balans is opening + debit - credit.
message TrialBalanceRow {
  uint32 account = 1;
  string name = 2;
  int64 debit = 3;
  int64 credit = 4;
  int64 opening = 5;
}

message GetTrialBalanceResponse {
  repeated TrialBalanceRow rows = 1;
}

message GetFinancialStatementsRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
}

enum StatementLineKind {
  STATEMENT_LINE_KIND_UNSPECIFIED = 0;
  STATEMENT_LINE_KIND_HEADING = 1;   // no amounts
  STATEMENT_LINE_KIND_ITEM = 2;
  STATEMENT_LINE_KIND_SUBTOTAL = 3;
}

// Öre, with the sign the statement shows: income, equity and liabilities
// positive, costs negative.
message StatementLine {
  string label = 1;
  StatementLineKind kind = 2;
  int64 amount = 3;
  optional int64 previous = 4;  // unset when there is no previous year
}

message GetFinancialStatementsResponse {
  repeated StatementLine income_statement = 1;
  repeated StatementLine balance_sheet = 2;
  string previous_fiscal_year_start = 3;  // empty when there is none
  // Summa tillgångar − summa eget kapital och skulder; not 0 only while an
  // earlier year is open.
  int64 difference = 4;
  optional int64 previous_difference = 5;
}

message GetAccountLedgerRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
  uint32 account = 3;
}

// balance is the account's balance after this line.
message LedgerEntry {
  string date = 1;
  uint32 number = 2;
  string text = 3;
  int64 debit = 4;
  int64 credit = 5;
  int64 balance = 6;
}

// opening is the ingående balans the running balance starts from.
message GetAccountLedgerResponse {
  repeated LedgerEntry entries = 1;
  int64 opening = 2;
}

message GetOpeningBalancesRequest {
  string company_id = 1;
}

message GetOpeningBalancesResponse {
  repeated VoucherLine lines = 1;
}

message SetOpeningBalancesRequest {
  string company_id = 1;
  repeated VoucherLine lines = 2;
}

message SetOpeningBalancesResponse {}

message CloseFiscalYearRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
}

// 0 when the result was already on equity and no voucher was booked.
message CloseFiscalYearResponse {
  uint32 result_voucher = 1;
}

message ReopenFiscalYearRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
  string reason = 3;
}

message ReopenFiscalYearResponse {}

// An underlag as uploaded. The server decides its type from the bytes.
message NewAttachment {
  string file_name = 1;
  bytes data = 2;
}

message Attachment {
  string id = 1;           // sha256, lowercase hex
  string file_name = 2;
  string content_type = 3; // application/pdf, image/jpeg or image/png
  uint64 size = 4;
}

message AddAttachmentRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
  uint32 number = 3;
  NewAttachment attachment = 4;
}

message AddAttachmentResponse {
  Attachment attachment = 1;
}

message GetAttachmentRequest {
  string company_id = 1;
  string fiscal_year_start = 2;
  uint32 number = 3;
  string id = 4;
}

message GetAttachmentResponse {
  Attachment attachment = 1;
  bytes data = 2;
}
